<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power Stats — หน้าหลัก</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:'Sarabun','TH Sarabun New',sans-serif;font-size:11pt;background:#f0f2f5;margin:0;padding:0}
  #main{padding:18px 20px}
  h1{font-size:15pt;border-bottom:2px solid #333;padding-bottom:6px;margin-top:0}
  h2{font-size:12pt;border-bottom:1px solid #aaa;padding-bottom:3px;margin-top:22px;color:#444}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
  .card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:12px 16px}
  .card .val{font-size:18pt;font-weight:bold;color:#2c3e50}
  .card .lbl{font-size:9pt;color:#888;margin-top:3px}
  .c1{border-left:4px solid #e74c3c}.c2{border-left:4px solid #3498db}
  .c3{border-left:4px solid #27ae60}.c4{border-left:4px solid #f39c12}
  .c5{border-left:4px solid #9b59b6}.c6{border-left:4px solid #1abc9c}
  .c7{border-left:4px solid #e67e22}
  .chart{background:#fff;border:1px solid #eee;border-radius:6px;margin:8px 0;padding:6px}
  table{border-collapse:collapse;width:100%;font-size:10pt;margin:8px 0}
  th,td{border:1px solid #ddd;padding:5px 10px;text-align:right}
  th{background:#f5f5f5;text-align:center}
  .row-weekday td:first-child{border-left:3px solid #e74c3c}
  .row-weekend td:first-child{border-left:3px solid #3498db}
  .row-holiday td:first-child{border-left:3px solid #9b59b6}
  tr:nth-child(even){background:#fafafa}
  .row-clickable{cursor:pointer}.row-clickable:hover{background:#f0f7ff!important}
  .note{font-size:9pt;color:#999;margin:4px 0}
  .tag-proj{color:#e67e22;font-size:8pt}
  .nav-bar{background:#2c3e50;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .nav-bar a{color:#bdc3c7;text-decoration:none;font-size:10pt}
  .nav-bar a.active,.nav-bar a:hover{color:#f39c12}
  .nav-bar select{padding:4px 8px;border-radius:4px;border:none;font-size:10pt;cursor:pointer}
  .nav-logo{color:#f39c12!important;font-weight:bold;font-size:13pt!important}
</style>
</head>
<body>
<div id="nav" class="nav-bar"></div>
<div id="main">
  <div id="loading" style="color:#888;padding:30px;text-align:center;font-size:12pt">กำลังโหลดข้อมูล...</div>
  <div id="content" style="display:none"></div>
</div>

<script>
let globalIdx = {monthly:[],daily:[],ev:[]};
let currentMonth = '';

function buildNav(month) {
  const opts = globalIdx.monthly.map(m=>
    `<option value="${m}"${m===month?' selected':''}>${m}</option>`).join('');
  const latestDate = (globalIdx.daily||[])[0]||'';
  document.getElementById('nav').innerHTML=`
    <a href="index.html" class="nav-logo">⚡ Power Stats</a>
    <select id="monthSel" onchange="switchMonth(this.value)">${opts}</select>
    <a href="index.html" class="active">🏠 หน้าหลัก</a>
    <a href="monthly.html?month=${month}">📋 Monthly</a>
    <a href="daily.html?date=${latestDate}">📅 Daily</a>
    <a href="ev.html?month=${month}">🔌 EV</a>`;
}

function switchMonth(m) {
  currentMonth = m;
  buildNav(m);
  loadDashboard(m);
}

fetch(`index.json?v=${Date.now()}`)
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(idx=>{
    try {
      globalIdx=idx;
      currentMonth = idx.latest_monthly || (idx.months||[])[0] || '';
      buildNav(currentMonth);
      if(currentMonth) loadDashboard(currentMonth);
      else document.getElementById('loading').textContent='ไม่พบข้อมูล';
    } catch(e) {
      console.error('Error after index.json loaded:', e);
      document.getElementById('loading').textContent='JS Error: '+e.message;
    }
  })
  .catch(e=>{
    console.error('Fetch index.json failed:', e);
    document.getElementById('loading').textContent='โหลด index.json ไม่ได้: '+e.message;
  });

function loadDashboard(month) {
  document.getElementById('loading').style.display='block';
  document.getElementById('content').style.display='none';

  const _v = Date.now();
  const p1 = fetch(`data/monthly_${month}.json?v=${_v}`).then(r=>r.ok?r.json():null).catch(()=>null);
  const evMonth = (globalIdx.ev||[]).find(m=>m===month) || (globalIdx.ev||[])[0];
  const p2 = evMonth ? fetch(`data/ev_${evMonth}.json?v=${_v}`).then(r=>r.ok?r.json():null).catch(()=>null)
                     : Promise.resolve(null);

  Promise.all([p1,p2]).then(([mdata,edata])=>renderDashboard(mdata,edata,month));
}

function renderDashboard(m, ev, month) {
  const today = new Date().toISOString().slice(0,10);
  const dtype_th = {weekday:'วันธรรมดา',weekend:'เสาร์/อาทิตย์',holiday:'วันหยุด'};

  let cardsHtml='<p style="color:#aaa;padding:20px">ไม่พบข้อมูล monthly</p>';
  let chartHtml='', tableHtml='';

  if(m) {
    const ps = new Date(m.period_start).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
    const pe = new Date(m.period_end).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
    cardsHtml=`
      <p style="color:#888;font-size:10pt;margin-bottom:12px">รอบบิล ${ps} – ${pe} · ข้อมูล ${m.total_days}/${m.days_in_period} วัน</p>
      <div class="grid4">
        <div class="card c1"><div class="val">${m.total_consumed.toFixed(0)} หน่วย</div>
          <div class="lbl">รวมใช้ไฟ Phase A</div></div>
        <div class="card c2"><div class="val">${m.total_cost_no.toFixed(0)} ฿</div>
          <div class="lbl">ค่าไฟถ้าไม่มี solar</div></div>
        <div class="card c3"><div class="val">${m.total_cost_with.toFixed(0)} ฿</div>
          <div class="lbl">ค่าไฟ with solar+battery</div></div>
        <div class="card c4"><div class="val">+${m.total_saving.toFixed(0)} ฿</div>
          <div class="lbl">ประหยัดสะสม</div></div>
      </div>
      <div class="grid4">
        <div class="card c5"><div class="val">${m.total_solar.toFixed(0)} หน่วย</div>
          <div class="lbl">Solar ผลิต (sim)</div></div>
        <div class="card" style="border-left:4px solid #1abc9c"><div class="val">${m.total_spill.toFixed(1)} หน่วย</div>
          <div class="lbl">⚡ ไฟเหลือทิ้ง (ใช้ได้ฟรี) มูลค่า ${(m.total_spill_value||0).toFixed(0)} ฿</div></div>
        <div class="card c6"><div class="val">+${m.proj_saving} ฿</div>
          <div class="lbl">Projected saving เต็มรอบ (${m.days_in_period} วัน)</div></div>
        <div class="card c3"><div class="val">${m.proj_cost_with} ฿</div>
          <div class="lbl">Projected bill (เทียบ ${m.proj_cost_no}฿ no solar)</div></div>
        <div class="card c7"><div class="val">${m.rem_wkd+m.rem_offd} วัน</div>
          <div class="lbl">คงเหลือ (${m.rem_wkd} วันธรรมดา + ${m.rem_offd} หยุด)</div></div>
      </div>`;

    const dates    = m.days.map(d=>d.date);
    const saving_g = m.days.map(d=>d.saving);
    const cumul    = saving_g.reduce((acc,v,i)=>{acc.push((acc[i-1]||0)+v);return acc;},[]);
    chartHtml = `<div class="chart" id="chart_saving" style="height:220px"></div>`;

    const recent = [...m.days].slice(-10);
    let trows='';
    recent.forEach(dd=>{
      const n_h=dd.n_hours||24, isToday=dd.date===today, partial=n_h<20&&isToday;
      const scale=(partial&&n_h>0)?24/n_h:1.0;
      const cost_w = (partial?dd.cost_with*scale:dd.cost_with).toFixed(0);
      const saving  = (partial?dd.saving*scale:dd.saving).toFixed(0);
      const kWh     = (partial?dd.consumed*scale:dd.consumed).toFixed(1);
      const solar   = dd.solar.toFixed(1);
      const tag = partial?`<span class="tag-proj"> ~${n_h}h</span>`:'';
      trows+=`<tr class="row-${dd.dtype} row-clickable" onclick="window.location='daily.html?date=${dd.date}'">
        <td style="text-align:left">${dd.date}${tag}</td>
        <td>${dtype_th[dd.dtype]||dd.dtype}</td>
        <td>${kWh}</td><td style="color:#f39c12">${solar}</td>
        <td>${cost_w}</td>
        <td style="color:#2980b9">+${saving}</td>
        <td>${dd.bat_end_soc?dd.bat_end_soc.toFixed(0)+'%':'—'}</td>
      </tr>`;
    });
    tableHtml=`<table>
      <tr><th>วันที่</th><th>ประเภท</th><th>kWh</th><th>Solar</th>
          <th>ค่าไฟ (w/solar)</th><th>ประหยัด</th><th>SOC end</th></tr>
      ${trows}</table>
    <p class="note">คลิกแถวเพื่อดู daily report · <a href="monthly.html?month=${month}">ดูทั้งหมด →</a></p>`;

    setTimeout(()=>{
      if(!document.getElementById('chart_saving')) return;
      Plotly.newPlot('chart_saving',[
        {x:dates,y:saving_g,type:'bar',name:'ประหยัด/วัน',marker:{color:'#27ae60'},opacity:0.7},
        {x:dates,y:cumul,type:'scatter',mode:'lines+markers',name:'สะสม',
         line:{color:'#2980b9',width:2},yaxis:'y2'}
      ],{title:'ประหยัดรายวัน + สะสม (รอบนี้)',
         xaxis:{title:'วันที่'},yaxis:{title:'฿/วัน'},
         yaxis2:{title:'สะสม (฿)',overlaying:'y',side:'right',showgrid:false},
         legend:{orientation:'h',y:-0.3},
         margin:{t:40,b:70},plot_bgcolor:'#fff'});
    },100);
  }

  let evHtml='<p style="color:#aaa">ไม่พบข้อมูล EV</p>';
  if(ev && ev.n_sessions>0) {
    const lastSess = ev.sessions[ev.sessions.length-1];
    const lastStart = new Date(lastSess.start);
    const lastStr = lastStart.toLocaleDateString('th-TH',{month:'2-digit',day:'2-digit'})
      + ' ' + lastStart.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    evHtml=`
      <div class="grid4">
        <div class="card c5"><div class="val">${ev.n_sessions} ครั้ง</div>
          <div class="lbl">ชาร์จรอบนี้</div></div>
        <div class="card c2"><div class="val">${ev.total_kwh.toFixed(1)} หน่วย</div>
          <div class="lbl">รวม kWh · ${ev.total_hours.toFixed(1)}h</div></div>
        <div class="card c1"><div class="val">${ev.total_cost.toFixed(0)} ฿</div>
          <div class="lbl">ค่าไฟ EV รอบนี้</div></div>
        <div class="card c4"><div class="val">${lastSess.kwh.toFixed(1)} หน่วย</div>
          <div class="lbl">ครั้งล่าสุด: ${lastStr}</div></div>
      </div>
      <p style="font-size:9pt;color:#888"><a href="ev.html?month=${ev.month}">ดูรายละเอียด EV ทั้งหมด →</a></p>`;
  }

  document.getElementById('content').innerHTML=`
    <h1>⚡ Power Stats — ${month}</h1>
    ${cardsHtml}
    <h2>ประหยัดรายวัน + สะสม</h2>
    ${chartHtml}
    <h2>รายวันล่าสุด</h2>
    ${tableHtml}
    <h2>EV Charging — ${ev?ev.month:month}</h2>
    ${evHtml}`;

  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
}
</script>
</body></html>
